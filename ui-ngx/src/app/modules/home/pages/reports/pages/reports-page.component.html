<div class="reports-page">
  <div class="page-header">
    <h2>Reportes PDF</h2>
    <button mat-raised-button color="primary" (click)="openCreateDialog()">
      Nueva plantilla
    </button>
  </div>

  <table mat-table [dataSource]="templates" class="mat-elevation-z2 full-width-table">

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Nombre</th>
      <td mat-cell *matCellDef="let template">{{ template.name }}</td>
    </ng-container>

    <ng-container matColumnDef="type">
      <th mat-header-cell *matHeaderCellDef>Tipo</th>
      <td mat-cell *matCellDef="let template">{{ template.type }}</td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Estado</th>
      <td mat-cell *matCellDef="let template">{{ template.status }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Acciones</th>
      <td mat-cell *matCellDef="let template">
        <button mat-button color="primary" (click)="openEditDialog(template)">Editar</button>
        <button mat-button color="accent" (click)="openGenerateDialog(template)">Generar</button>
        <button mat-button color="warn" (click)="deleteTemplate(template)">Eliminar</button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
