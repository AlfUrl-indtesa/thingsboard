<h2 mat-dialog-title>{{ 'reports.generate_report' | translate }}</h2>

<div mat-dialog-content [formGroup]="form" class="dialog-content">

  <mat-form-field appearance="outline">
    <mat-label>{{ 'reports.start' | translate }}</mat-label>
    <input matInput type="datetime-local" formControlName="startTime">
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>{{ 'reports.end' | translate }}</mat-label>
    <input matInput type="datetime-local" formControlName="endTime">
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>{{ 'reports.timezone' | translate }}</mat-label>
    <input matInput formControlName="timezone">
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>{{ 'reports.locale' | translate }}</mat-label>
    <input matInput formControlName="locale">
  </mat-form-field>

</div>

<div mat-dialog-actions align="end">
  <button mat-button (click)="close()">
    {{ 'action.cancel' | translate }}
  </button>

  <button mat-raised-button color="primary" (click)="generate()">
    {{ 'reports.generate_report' | translate }}
  </button>
</div>
