<div class="executions-page">
  <div class="page-header">
    <h2>{{ 'reports.executions' | translate }}</h2>
  </div>

  <table mat-table [dataSource]="executions" class="mat-elevation-z2 full-width-table">

    <ng-container matColumnDef="templateNameSnapshot">
      <th mat-header-cell *matHeaderCellDef>{{ 'reports.report' | translate }}</th>
      <td mat-cell *matCellDef="let execution">{{ execution.templateNameSnapshot }}</td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>{{ 'reports.status' | translate }}</th>
      <td mat-cell *matCellDef="let execution">{{ execution.status }}</td>
    </ng-container>

    <ng-container matColumnDef="requestedTime">
      <th mat-header-cell *matHeaderCellDef>{{ 'reports.requested_time' | translate }}</th>
      <td mat-cell *matCellDef="let execution">{{ execution.requestedTime | date:'medium' }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>{{ 'reports.actions' | translate }}</th>
      <td mat-cell *matCellDef="let execution">
        <button mat-button color="primary" [disabled]="!execution.fileName" (click)="downloadExecution(execution)">
          {{ 'reports.download' | translate }}
        </button>
        <button mat-button color="warn" [disabled]="!execution.fileName" (click)="deleteExecution(execution)">
          {{ 'reports.delete_generated_report' | translate }}
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
